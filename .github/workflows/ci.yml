name: Java checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - run: make clean check build demo
      - name: Verify failing example and machine-readable JSON
        shell: bash
        run: |
          set +e
          java -jar build/config-audit.jar --schema examples/service.schema --config examples/invalid.env --format env --output json > report.json
          status=$?
          set -e
          test "$status" -eq 1
          python3 -c 'import json; r=json.load(open("report.json")); assert r["status"] == "fail" and r["errors"] > 0'
